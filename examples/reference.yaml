# ╔══════════════════════════════════════════════════════════════════╗
# ║  VLA-Factory Training Recipe — Reference Template               ║
# ║  每个字段都标注了含义、可选值和典型用法。                         ║
# ║  复制此文件作为起点，删除不需要的部分即可。                       ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# recipe 分三个区（架构 §3.1）：
#   ① 组合选择：用哪份数据、哪个模型、哪台机器人 —— model / data / robot
#   ② 组合调整：仅当解析器无法唯一确定关系时的受控 override —— overrides
#   ③ 训练参数：怎么训练，与三者关系无关 —— finetuning / training / output
#
# 三者之间的关系（相机进哪个槽位、动作维度怎么 padding、chunk 多长、图像 resize
# 到多大）**不写在 recipe 里**，由组合解析层从数据、模型、机器人三份描述推导。
# 用 `vlafactory-cli resolve --config <recipe>` 可以先看一眼推导结果。
#
# ── 已删除的字段（现在会作为未知字段直接报错） ─────────────────────
#   action_spec.*                → 数据集事实 / 模型声明 / 机器人 profile
#   data.source.*                → 直接写在 data 下（少一层嵌套）
#   data.sampler.*               → 模型的时序契约（观测帧数 / chunk 长度）
#   data.split.*                 → 当前无训练期评估，全部 episode 用于训练
#   training.augmentation.*      → 无（从未被任何 transform 应用过）
#   training.inference_steps     → model.config.num_inference_steps
#   model.config.camera_mapping  → overrides.camera_mapping
#   model.config.default_task    → overrides.default_task
#   composition: / assembly:     → overrides:
# 这些键不再属于公共结构；强类型块可能直接拒绝，请从 recipe 中删除。

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 模型 ──────────────────────────────────────────────────────────────
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
model:
  name: act                    # [必填] 注册表中的模型名
                               #   可选值: act | pi0 | pi05 | openvla-7b | gr00t | octo | smolvla
                               #
                               # 简写：`model: act`；若字符串含 `/`，完整字符串
                               # 同时作为 checkpoint path，最后一段作为 name，
                               # 例如 `model: lerobot/pi0`。

  path: null                   # [可选] 预训练权重路径
                               #   - 指向目录或文件，由模型的 factory 解读
                               #   - null = 从零训练 (适用于 ACT 等小模型)
                               #   - pi0/pi05 仅支持微调，训练时必填 (如 "lerobot/pi0_base")
                               #   - 示例: "outputs/openpi/pi0.5", "openvla/openvla-7b"

  # config:                    # [可选] 逐 run 的模型超参覆盖，深度合并到模型声明的
  #                            #   ModelMetadata.params 之上 (recipe 优先)。
  #                            #   可调键以 `vlafactory-cli inspect model --name <model>`
  #                            #   为准，它同时显示每个键的生效值与来源；写了模型未
  #                            #   声明的键会直接报错并提示最接近的候选。
  #                            #   组合解析消费的事实 (图像值域、归一化方法、维度策略…)
  #                            #   属于模型声明的具名字段，不可在此覆盖。
  #   num_inference_steps: 10  # [可选] 去噪/flow-matching 步数 (pi0 默认 10, ACT 为 1)
  #   pytorch_compile_mode: null  # [可选] pi0/pi05: 小显存或冒烟测试时设 null 走 eager
  #   action_horizon: 100      # [仅 from_scratch 模型, 如 ACT] chunk 长度由用户选。
                               #   pi0/pi05 是预训练固定长度 (家族事实)，不接受此键。
  #   input_image_size: [224, 224]  # [仅 from_scratch 模型] 模型输入图像尺寸；
                               #   不写则用数据集原生尺寸。固定槽位模型 (pi0) 的尺寸
                               #   来自 ModelMetadata.vision_slots，不可在此覆盖。


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 数据 ─────────────────────────────────────────────────────────────
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
data:
  path: ""                     # [必填] 数据集根路径
                               #   示例: "outputs/lerobot_train_data_100"

  format: auto                 # [可选] 数据格式
                               #   ┌──────────────┬──────────────────────────────┐
                               #   │ 值            │ 说明                         │
                               #   ├──────────────┼──────────────────────────────┤
                               #   │ auto         │ 自动检测 (推荐)              │
                               #   │ lerobot-v3   │ HuggingFace LeRobot v3 格式   │
                               #   │ hdf5         │ HDF5 (Robomimic / ALOHA)     │
                               #   │ rlds         │ TFRecord RLDS 格式           │
                               #   │ zarr         │ Zarr 数组 (BridgeData V2)    │
                               #   └──────────────┴──────────────────────────────┘

  # video_codec: auto          # [可选] 视频解码器 (auto 按格式选择)

  # 一个样本携带多少观测帧、多少未来动作，都是模型的时序契约
  # (ModelMetadata.history_frames / action horizon)，由组合解析层给出；
  # 当前没有训练期评估，全部 episode 都用于训练。真正实现 evaluation loop 时
  # 再按 episode 恢复 split；这些都不是 recipe 需要复述的模型接口事实。


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 组合选择 + 组合调整（可选） ───────────────────────────────────────
#   ① robot 区只声明本体，不描述连接/transport；
#   ② overrides 区只在解析器无法唯一确定、或想用非默认策略时显式写出，且不能
#      改写客观事实（shape、checkpoint 槽位、关节拓扑、固定维度上限）。
#   三者之间的默认对应关系由组合解析层自动推导；本区默认留空即可。
#   目前由 `vlafactory-cli resolve --config <recipe>` dry-run 消费。
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
robot:
  name: ""                     # [可选] 机器人本体 profile 名 (见 vla_factory/robot/profiles/*.yaml)
                               #   示例: "robotwin"。留空表示不绑定具体本体。
                               #   写了之后解析器会把数据的逐维关节名嵌入机器人关节表
                               #   (产出 JointMapping)，对不上就直接失败——这正是它的
                               #   价值：错位的命令向量不会流到机器人上。

overrides:                     # [可选, 默认留空]
  # camera_mapping:            # 模型视觉槽位 -> 数据集相机 (歧义时显式指定)
  #   base_0_rgb: front        #   给了就是**完整声明**：没列出的槽位视为有意留空，
  #   left_wrist_0_rgb: wrist  #   走占位图 + zero mask，不再对它做自动推断。
  # default_task: "pick up the block"  # 语言兜底 (数据/部署无 task 时使用)。
                               #   优先级: 帧级 task 文本 > default_task > 空 prompt。
                               #
                               # 本区只放解析器真正消费的 override —— 没有消费者的
                               # 调整项等于"能写、但什么都不做"，因此频率/夹爪两项
                               # 随它们的检查一起推迟，未提供。


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 微调策略 ─────────────────────────────────────────────────────────
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
finetuning:
  strategy: full               # [必填] 微调策略
                               #   ┌────────────┬────────────────────────────────────┐
                               #   │ 值          │ 适用场景                           │
                               #   ├────────────┼────────────────────────────────────┤
                               #   │ full       │ 全参数训练 (ACT从零训练, 或全量微调)  │
                               #   │ lora       │ LoRA 低秩适配 (大模型推荐)           │
                               #   │ freeze     │ 冻结指定组件, 训练其余               │
                               #   │ selective  │ 只训练指定组件, 冻结其余             │
                               #   └────────────┴────────────────────────────────────┘

  # 每个 strategy 严格校验自己的 config；切换策略时只保留对应的字段。
  # ── strategy == "lora" 时取消下面整块注释 ──
  # 字段名与 peft.LoraConfig 对齐（r/lora_alpha/lora_dropout/use_rslora/init_lora_weights
  # 透传给 peft）。components 是 vla 自己的抽象（component → subtree → peft
  # target_modules），因为不同模型 module 名不同；它与 freeze/selective 同名，
  # 都取 ModelMetadata.components 的 key。freeze_components 可选，冻死而非全训
  # 选定子树之外的某些子树（如 "action_expert 冻结 + llm LoRA"）。
  # 默认行为（只写 r/lora_alpha 即可）：components 默认 "all"（对全部组件打
  # LoRA，等价 openpi 低显存 gemma_2b_lora+gemma_300m_lora / llamafactory
  # lora_target=all）；freeze_components 默认 []；target_modules 默认
  # "all-linear"（peft 特殊串，匹配所有 Linear/Conv1D）。
  # config:
  #   r: 16                      # LoRA 秩, 越大容量越大. 常用: 8, 16, 32
  #   lora_alpha: 16             # 缩放因子, 等效 = lora_alpha / r
  #   lora_dropout: 0.0          # adapter dropout, 透传 peft
  #   use_rslora: false          # rank-stabilized LoRA, 透传 peft
  #   init_lora_weights: gaussian # 初始化方案, 透传 peft
  #   components: [llm]           # 打 LoRA 的子树; 默认 "all" = 全部组件
  #   freeze_components: [action_expert]  # 冻死而非全训的子树 (可选), 默认 []
  #   target_modules: all-linear  # peft 线性层名; 默认 "all-linear", 或列表如 [q_proj, v_proj]

  # ── strategy == "freeze" 时需要 ──
  # config: {components: [vision_encoder]}   # 冻结视觉编码器

  # ── strategy == "selective" 时需要 ──
  # config: {components: [action_head]}      # 只训练 action head


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 训练参数 ─────────────────────────────────────────────────────────
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
training:
  backend: pytorch             # 训练后端
                               #   pytorch | jax (预留)

  lr: 1.0e-4                   # 基础学习率
                               #   ACT: 1e-4 ~ 1e-5
                               #   PI0 LoRA: 2.5e-5
                               #   OpenVLA: 5e-5

  lr_backbone: null            # [可选] backbone 独立学习率 (通常更低)
                               #   ACT: ResNet 用 1e-5
                               #   null = 与 lr 相同

  batch_size: 8                # 每 GPU 批大小

  total_steps: 50000           # 总训练步数 (optimizer steps)

  gradient_accumulation_steps: 1 # 梯度累积步数；有效 batch = batch_size × 此值

  lr_scheduler_type: constant  # HuggingFace 学习率调度器，如 constant | cosine | linear

  warmup_steps: 0              # 学习率 warmup 步数

  max_grad_norm: 10.0          # 梯度裁剪上限

  gradient_checkpointing: false # 梯度检查点: 省 ~40% 显存, 慢 ~30%
                                #   大模型 (PI0, OpenVLA) 建议开启

  num_workers: 4               # DataLoader 子进程数
                               #   0 = 单进程 (调试用)
                               #   4~8 = 多进程并行加载 (推荐, 视频数据集建议 ≥4)



# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 输出 ─────────────────────────────────────────────────────────────
# 注意: 输出字段必须嵌套在 output: 块下; 顶层的 output_dir: 会直接报错。
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
output:
  output_dir: outputs/act_aloha  # [必填] checkpoint、日志、最终权重的保存目录
                                 #   示例: "outputs/act_aloha_000"

  report_to: none                # [可选] 训练日志后端
                                 #   ┌──────────────┬────────────────────┐
                                 #   │ 值            │ 说明               │
                                 #   ├──────────────┼────────────────────┤
                                 #   │ none         │ 不记录 (默认)       │
                                 #   │ tensorboard  │ TensorBoard         │
                                 #   │ wandb        │ Weights & Biases   │
                                 #   └──────────────┴────────────────────┘

  logging_steps: 200             # [可选] 每隔 N 步记录一次训练指标

  save_steps: 20000              # [可选] 每隔 N 步保存一个 checkpoint

  save_total_limit: 3            # [可选] 最多保留的 checkpoint 数量
                                 #   超出后删除最旧的

  overwrite_output_dir: true     # [可选] 训练前是否清空 output_dir
                                 #   true  = 清空 (重新训练时推荐)
                                 #   false = 追加 (断点续训时用)
