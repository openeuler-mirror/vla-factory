<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
  <title id="title">VLA Factory Overall Architecture Diagram</title>
  <desc id="desc">The four layers of VLA Factory: user expression, finetuning and inference, composition resolution, and the data/model/robot dimensions. Each layer shows only its pluggable extensions, not internal component implementations.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .layer { stroke-width: 1.5; filter: url(#shadow); }
      .user { fill: #eff6ff; stroke: #60a5fa; }
      .train { fill: #fefce8; stroke: #eab308; }
      .infer { fill: #ecfeff; stroke: #22d3ee; }
      .resolve { fill: #f5f3ff; stroke: #a78bfa; }
      .data { fill: #f0fdf4; stroke: #4ade80; }
      .model { fill: #fff7ed; stroke: #fb923c; }
      .robot { fill: #fdf2f8; stroke: #f472b6; }
      .title { font: 700 26px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .layer-title { font: 700 21px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .code { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" width="960" height="490"/>

  <text x="480" y="48" text-anchor="middle" class="title">VLA Factory Overall Architecture</text>

  <!-- Row 1: User Expression Layer -->
  <rect x="55" y="112" width="850" height="72" rx="14" class="layer user"/>
  <text x="480" y="146" text-anchor="middle" class="layer-title">User Expression Layer</text>
  <text x="480" y="170" text-anchor="middle" class="code">vlafactory-cli | YAML recipe | API | ……</text>

  <!-- Row 2: Finetuning | Inference -->
  <rect x="55" y="208" width="413" height="72" rx="14" class="layer train"/>
  <text x="262" y="242" text-anchor="middle" class="layer-title">Finetuning Layer</text>
  <text x="262" y="266" text-anchor="middle" class="code">LoRA | PiSSA | GaLore | ……</text>

  <rect x="492" y="208" width="413" height="72" rx="14" class="layer infer"/>
  <text x="698" y="242" text-anchor="middle" class="layer-title">Inference Layer</text>
  <text x="698" y="266" text-anchor="middle" class="code">RoboTwin | LIBERO | ManiSkill | ……</text>

  <!-- Row 3: Composition Resolution Layer (title only) -->
  <rect x="55" y="304" width="850" height="56" rx="14" class="layer resolve"/>
  <text x="480" y="338" text-anchor="middle" class="layer-title">Composition Resolution Layer</text>

  <!-- Row 4: Data | Model | Robot -->
  <rect x="55" y="384" width="270" height="72" rx="14" class="layer data"/>
  <text x="190" y="418" text-anchor="middle" class="layer-title">Data</text>
  <text x="190" y="442" text-anchor="middle" class="code">LeRobot | RLDS | HDF5 | ……</text>

  <rect x="345" y="384" width="270" height="72" rx="14" class="layer model"/>
  <text x="480" y="418" text-anchor="middle" class="layer-title">VLA Model</text>
  <text x="480" y="442" text-anchor="middle" class="code">GR00T | OpenPI | OpenVLA | ……</text>

  <rect x="635" y="384" width="270" height="72" rx="14" class="layer robot"/>
  <text x="770" y="418" text-anchor="middle" class="layer-title">Robot</text>
  <text x="770" y="442" text-anchor="middle" class="code">SO101 | Lekiwi | Franka | ……</text>
</svg>
